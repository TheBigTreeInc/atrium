jobs:
  clear-market:
    intervalSeconds: 60
    execution: inline
    timeoutSeconds: 30
    maxAttempts: 3
    retrySeconds: 60
    source: |
      """One persistent shared exchange. Loopback demo identity/credits are not Tavi identities/Gold.

      Uniform-price scheduled call auctions, finite maker share inventory, no client clock
      control. SQLite BEGIN IMMEDIATE serializes orders/settlement across processes.
      """
      from __future__ import annotations
      """Atrium Market Grove exchange extension: fictional instruments, bounded matching and bots.

      This module is source-inlined into the independent LoopRD child by the generator.
      Never contains a live-wallet settlement capability or fiat/commodity trading endpoint.
      """

      import hashlib

