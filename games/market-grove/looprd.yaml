apiVersion: looprd/v1
component: market-grove
release: 0.4.0
api:
  version: v1
auth:
  mode: database
  scopes:
  - market:read
  - market:trade
  - market:reference
database:
  backend: sqlite
  schemaVersion: 2
registrations:
- service: atrium
  document: atriumd.yaml
requires:
