          ('COCO','Cocoa Index','Agriculture commodity',89,'❧'),('COFF','Coffee Index','Agriculture commodity',61,'❧'),
          ('EURX','EUR/USD Index','FX index',100,'¤'),('GBPX','GBP/USD Index','FX index',109,'¤'),
