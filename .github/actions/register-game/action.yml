name: Atrium portable game compatibility
# This action is intentionally read-only. It never contacts Atrium or needs its secrets.
description: Validate a game and notify a public, unprivileged LoopRD Atrium inbox
inputs:
  source-sha:
    description: Immutable 40-character source SHA used for the successful game Pages deployment
    required: true
  registration-config-url:
    description: Operator-published Atrium registration config URL
    required: false
    default: 'https://thebigtreeinc.github.io/atrium/registration-config.json'
  pages-run-id:
    description: GitHub Pages deployment workflow run ID
    required: true
outputs:
  game-id:
    description: Validated portable game ID
    value: ${{ steps.validate.outputs.game_id }}
  component:
    description: Validated LoopRD component
    value: ${{ steps.validate.outputs.component }}
runs:
  using: composite
  steps:
    - name: Install portable sidecar parser
      shell: bash
      run: python -m pip install --quiet 'PyYAML>=6,<7'
    - name: Check Atrium compatibility at the checked-out game revision
      id: validate
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/check.py" --root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA"
    - name: Publish compatibility result in the game's Actions log
      shell: bash
      run: echo 'Atrium-compatible source validated. Registration is a non-privileged verification notice, NOT publication.' >> "$GITHUB_STEP_SUMMARY"
    - name: Notify public Atrium LoopRD intake (no Atrium token)
      shell: bash
      env:
        ATRIUM_REGISTRATION_CONFIG_URL: ${{ inputs.registration-config-url }}
        REGISTRATION_REPO: ${{ github.repository }}
        REGISTRATION_SHA: ${{ inputs.source-sha }}
        REGISTRATION_RUN_ID: ${{ inputs.pages-run-id }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/notify.sh"
