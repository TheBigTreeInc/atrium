name: Atrium compatible game registration
description: Validate a portable LoopRD game and optionally notify Atrium of an immutable released revision
inputs:
  source-sha:
    description: Immutable 40-character source SHA used for the successful game Pages deployment
    required: true
  atrium-token:
    description: Optional GitHub App installation token scoped to Atrium Actions WRITE only; never a general repository write token
    required: false
    default: ''
  atrium-repository:
    description: Atrium registration target (operator-controlled)
    required: false
    default: TheBigTreeInc/atrium
outputs:
  game-id:
    description: Validated portable game ID
    value: ${{ steps.validate.outputs.game_id }}
  component:
    description: Validated LoopRD component
    value: ${{ steps.validate.outputs.component }}
  registration-sent:
    description: Whether an Atrium registration dispatch was submitted
    value: ${{ steps.dispatch.outputs.sent }}
runs:
  using: composite
  steps:
    - name: Install portable sidecar parser
      shell: bash
      run: python -m pip install --quiet 'PyYAML>=6,<7'
    - name: Check Atrium compatibility at the checked-out game revision
      id: validate
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/check.py" --root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA"
    - name: Request Atrium registration (no main-branch write from the game)
      id: dispatch
      shell: bash
      env:
        ATRIUM_TOKEN: ${{ inputs.atrium-token }}
        ATRIUM_TARGET: ${{ inputs.atrium-repository }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        GAME_ID: ${{ steps.validate.outputs.game_id }}
      run: |
        echo 'sent=false' >> "$GITHUB_OUTPUT"
        if [ -z "$ATRIUM_TOKEN" ]; then
          echo 'Compatibility validated. No registration token supplied; no dispatch sent.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
          echo 'Registration only permitted from the default main branch' >&2
          exit 1
        fi
        python - <<'PY' > "$RUNNER_TEMP/atrium-registration-event.json"
        import json,os
        print(json.dumps({'ref':'main','inputs':{
          'repository':os.environ['GITHUB_REPOSITORY'],
          'sha':os.environ['SOURCE_SHA'],
          'gameId':os.environ['GAME_ID']}}))
        PY
        curl --fail-with-body --silent --show-error --retry 2 -X POST \
          -H 'Accept: application/vnd.github+json' \
          -H "Authorization: Bearer $ATRIUM_TOKEN" \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          --data-binary "@$RUNNER_TEMP/atrium-registration-event.json" \
          "https://api.github.com/repos/$ATRIUM_TARGET/actions/workflows/receive-game.yml/dispatches"
        echo 'sent=true' >> "$GITHUB_OUTPUT"
        echo 'Atrium registration received; independent review/verification occurs in Atrium.' >> "$GITHUB_STEP_SUMMARY"
