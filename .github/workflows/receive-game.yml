name: Synchronize verified game registrations
# Runs entirely in Atrium. No game workflow sends tokens or edits this repository.
on:
  schedule:
    - cron: '17,32,47,2 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # only Atrium may optionally dispatch Atrium Pages
concurrency:
  group: atrium-approved-games-sync
  cancel-in-progress: false
jobs:
  synchronize:
    name: Pull and validate approved GitHub Pages games
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify public LoopRD notices and independently reconcile approved releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATRIUM_PUBLIC_REGISTRATION_ENDPOINT: ${{ vars.ATRIUM_PUBLIC_REGISTRATION_ENDPOINT }}
        run: python tools/sync_registration_notices.py
      - name: Verify generated catalog and compatibility contracts
        run: |
          python -m unittest tests.test_github_game_registry tests.test_github_source_sync tests.test_public_registration -q
          npm test
          npm run build
          npm run verify
      - name: Commit Atrium-owned catalog changes
        id: catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/games registry/registration-history.json web/hosted-games.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No approved game registration changes' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'Sync approved game releases from trusted GitHub sources'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish updated Pages only if Atrium operator enabled automation
        if: steps.catalog.outputs.changed == 'true' && vars.ATRIUM_AUTO_DEPLOY_PAGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ATRIUM_TAVI_BASE_URL: ${{ vars.ATRIUM_TAVI_BASE_URL }}
          ATRIUM_PUBLIC_HOSTED_CATALOG_URL: ${{ vars.ATRIUM_PUBLIC_HOSTED_CATALOG_URL }}
          ATRIUM_PUBLIC_REGISTRATION_ENDPOINT: ${{ vars.ATRIUM_PUBLIC_REGISTRATION_ENDPOINT }}
          ATRIUM_PUBLIC_CATALOG_URL: ${{ vars.ATRIUM_PUBLIC_CATALOG_URL }}
        run: |
          if [ -z "$ATRIUM_TAVI_BASE_URL" ]; then
            echo 'Atrium Pages auto-publication requires approved ATRIUM_TAVI_BASE_URL to preserve Tavi publication' >&2
            exit 1
          fi
          gh workflow run pages.yml --ref main \
            -f extension_base_url="$ATRIUM_TAVI_BASE_URL" \
            -f hosted_catalog_url="$ATRIUM_PUBLIC_HOSTED_CATALOG_URL" \
            -f registration_endpoint_url="$ATRIUM_PUBLIC_REGISTRATION_ENDPOINT" \
            -f catalog_url="$ATRIUM_PUBLIC_CATALOG_URL"
