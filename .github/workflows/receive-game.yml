name: Review trusted game registration
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Released source repository owner/name; untrusted until Atrium verifies policy
        required: true
        type: string
      sha:
        description: Exact immutable successful source release SHA
        required: true
        type: string
      gameId:
        description: Claimed game ID (compared to fetched source)
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: atrium-git-game-registry
  cancel-in-progress: false
jobs:
  register:
    name: Revalidate trusted source and update reviewed catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Fetch immutable game source and independently verify publication
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_SHA: ${{ inputs.sha }}
          SOURCE_GAME_ID: ${{ inputs.gameId }}
        run: |
          python tools/github_game_registry.py --repository "$SOURCE_REPOSITORY" --sha "$SOURCE_SHA"
          python - <<'PY'
          import json,os
          game=json.load(open('web/hosted-games.json',encoding='utf-8'))
          if not any(x['gameId']==os.environ['SOURCE_GAME_ID'] and x['sourceRevision']==os.environ['SOURCE_SHA'] for x in game['games']):
              raise SystemExit('Dispatched game does not match independent catalog output')
          PY
      - name: Verify catalog rendering and source contracts
        run: |
          python -m unittest discover -s tests -q
          npm test
          npm run build
          npm run verify
      - name: Commit verified source-of-truth JSON to Atrium main
        run: |
          git config user.name 'atrium-registration[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/games web/hosted-games.json
          if git diff --cached --quiet; then
            echo 'Already registered at the same immutable revision'
            exit 0
          fi
          git commit -m 'Register reviewed game from trusted GitHub source'
          git push origin HEAD:main
          # A push made with GITHUB_TOKEN does not start ordinary push workflows.
          # workflow_dispatch is an allowed exception: run source checks explicitly.
          gh workflow run verify.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
