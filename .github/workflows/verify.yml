name: Verify Atrium source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Source, pinned DAPI and ZipRunner contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Verify checked-in generated handlers
        run: |
          python tools/build_spec.py --check
          python tools/build_registry_spec.py --check
          python tools/build_registration_spec.py --check
          python tools/build_market_grove_spec.py --check
      - name: Strict source spec and Python tests
        run: |
          python tools/check_specs.py
          python tools/validate_atriumd.py examples/life.atriumd.yaml --component the-life-loop
          python -m unittest discover -s tests -v
      - name: Node tests and deterministic web build
        run: |
          npm test
          npm run build
          npm run verify
          node tools/build_tavi_extension.mjs
      - name: Fetch pinned DAPI runtime
        uses: actions/checkout@v4
        with:
          repository: pac-labs/dapi
          ref: c2b486bc7f526e71d8c26d77cb56bff9270d3347
          path: _upstream/dapi
          persist-credentials: false
      - name: Fetch pinned ZipRunner interchange validator
        uses: actions/checkout@v4
        with:
          repository: pac-labs/ziprunner-spec
          ref: 341005206094862853435ad68801be7ff28c4490
          path: _upstream/ziprunner-spec
          persist-credentials: false
      # Pinned DAPI checkout excludes generated panel.css from Git. Its runtime
      # imports that asset at startup; compile it with DAPI's own locked Sass toolchain.
      - name: Select DAPI UI build toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build pinned DAPI panel CSS
        working-directory: _upstream/dapi
        run: |
          npm ci --ignore-scripts
          npm run build:ui
      - name: Assert pinned DAPI generated CSS exists
        run: test -s _upstream/dapi/looprd/panel_assets/panel.css
      - name: Validate against actual DAPI
        run: |
          python -m pip install -e _upstream/dapi
          python -m looprd validate looprd.yaml
          python -m looprd validate games/market-grove/looprd.yaml
          python -m looprd validate modules/registration/looprd.yaml
          python -m looprd validate examples/sources.local.yaml --sources
          python tools/smoke_dapi.py
      - name: Build and validate ZipRunner source ZIP
        run: |
          python tools/package_zip.py
          python _upstream/ziprunner-spec/tools/validate.py package dist/atrium-0.5.39-ziprunner.zip --expected-project atrium --require-verification-plan
          python _upstream/ziprunner-spec/tools/validate.py looprd ziprunner.looprd.json --root . --expected-project atrium
      - name: Upload Tavi extension build from same source SHA (no auto-deploy)
        uses: actions/upload-artifact@v4
        with:
          name: atrium-tavi-extension-1.0.3
          path: dist-tavi/
          if-no-files-found: error
      - name: Upload source ZIP for operator review (no auto-deploy)
        uses: actions/upload-artifact@v4
        with:
          name: atrium-0.5.39-ziprunner
          path: dist/atrium-0.5.39-ziprunner.zip
          if-no-files-found: error

  windows-ziprunner-build:
    name: Windows ZipRunner build recipe smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated Windows Python environment
        run: python tools/setup_build_env.py
      - name: Run source checks under venv Python
        run: python tools/run_python_checks.py
      - name: Verify ZipRunner registered isolated Python recipe
        run: python tools/run_python_checks.py
      - name: Check JavaScript build
        run: |
          npm test
          npm run build
          npm run verify
          node tools/build_tavi_extension.mjs
      - name: Check protected artifact exclusions
        run: python tools/package_zip.py
