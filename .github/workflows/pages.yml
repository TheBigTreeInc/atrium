name: Publish reviewed Atrium Pages
on:
  # Opt-in once at repository level: ATRIUM_AUTO_PUBLISH_CATALOG=true.
  # Runs only after a successful exact-commit Verify Atrium source workflow.
  workflow_run:
    workflows: ['Verify Atrium source']
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_checkers_demo:
        description: Explicitly publish first-party Checkers local preview (requires empty catalog_url)
        required: false
        type: boolean
        default: false
      extension_base_url:
        description: Approved HTTPS URL ending in /atrium/tavi/ (empty disables extension publication)
        required: false
        type: string
        default: ''
      hosted_catalog_url:
        description: Public HTTPS read-only reviewed hosted games endpoint (empty keeps empty local preview)
        required: false
        type: string
        default: ''
      catalog_url:
        description: Public HTTPS catalog gateway URL (empty keeps staged preview)
        required: false
        type: string
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: atrium-pages
  cancel-in-progress: false
jobs:
  publish:
    name: Build and publish reviewed Atrium storefront
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            vars.ATRIUM_AUTO_PUBLISH_CATALOG == 'true' &&
            vars.ATRIUM_TAVI_BASE_URL != '') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and static client
        run: |
          npm test
          npm run build
          npm run verify
      - name: Set operator-approved public catalog gateway (no secrets)
        env:
          ATRIUM_PUBLIC_CATALOG_URL: ${{ inputs.catalog_url }}
        run: |
          node tools/configure_catalog.mjs
          npm run verify
      - name: Configure operator-reviewed hosted-game catalog (no secrets)
        env:
          ATRIUM_PUBLIC_HOSTED_CATALOG_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_catalog_url || '' }}
        run: |
          node tools/configure_hosted_catalog.mjs
          npm run verify
      - name: Stage operator-approved Checkers local preview (optional)
        if: ${{ inputs.publish_checkers_demo }}
        env:
          ATRIUM_PUBLISH_CHECKERS_DEMO: 'true'
        run: |
          node tools/stage_checkers.mjs
          npm run verify
      - name: Build optional Tavi extension from the same source revision
        env:
          ATRIUM_TAVI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.extension_base_url || vars.ATRIUM_TAVI_BASE_URL }}
        run: |
          if [ -n "$ATRIUM_TAVI_BASE_URL" ]; then
            node tools/build_tavi_extension.mjs
            node tools/build_tavi_repository.mjs "$ATRIUM_TAVI_BASE_URL"
            mkdir -p dist/tavi
            cp -r dist-tavi/ui dist/tavi/ui
            cp dist-tavi/tavi.repository.json dist/tavi/tavi.repository.json
          fi
      - name: Configure repository Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish after operator-triggered approval
        id: deployment
        uses: actions/deploy-pages@v4
