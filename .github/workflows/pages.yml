name: Publish reviewed Atrium Pages
on:
  workflow_dispatch:
    inputs:
      publish_checkers_demo:
        description: Explicitly publish first-party Checkers local preview (requires empty catalog_url)
        required: false
        type: boolean
        default: false
      catalog_url:
        description: Public HTTPS catalog gateway URL (empty keeps staged preview)
        required: false
        type: string
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: atrium-pages
  cancel-in-progress: false
jobs:
  publish:
    name: Build and publish reviewed Atrium storefront
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and static client
        run: |
          npm test
          npm run build
          npm run verify
      - name: Set operator-approved public catalog gateway (no secrets)
        env:
          ATRIUM_PUBLIC_CATALOG_URL: ${{ inputs.catalog_url }}
        run: |
          node tools/configure_catalog.mjs
          npm run verify
      - name: Stage operator-approved Checkers local preview (optional)
        if: ${{ inputs.publish_checkers_demo }}
        env:
          ATRIUM_PUBLISH_CHECKERS_DEMO: 'true'
        run: |
          node tools/stage_checkers.mjs
          npm run verify
      - name: Configure repository Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish after operator-triggered approval
        id: deployment
        uses: actions/deploy-pages@v4
