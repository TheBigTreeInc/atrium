    """Strict, immutable application manifest contract for trusted review.

    This validates *metadata*, not asset content, TLS origin ownership or publisher authority.
    Those require separate operator/CI checks before publishing.
    """
    import hashlib
    import ipaddress
    import json
    import re
    from urllib.parse import urlsplit

    APP_ID = re.compile(r"^[a-z][a-z0-9.-]{2,119}$")
    PUBLISHER_ID = re.compile(r"^[a-z][a-z0-9-]{2,119}$")
    VERSION = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
    ALLOWED_KINDS = frozenset({'game', 'social', 'utility', 'application'})
    PERMISSIONS = frozenset({'profile:read', 'game:join', 'notifications:read'})
    FIELDS = frozenset({'id', 'title', 'version', 'publisher', 'kind', 'entry', 'sha256', 'permissions'})


    def validate_origin(origin):
        """Accept DNS-based HTTPS origins only; these still require ownership review."""
        if not isinstance(origin, str) or len(origin) > 255:
            raise ValueError('invalid origin')
        try:
            parts = urlsplit(origin)
            host = parts.hostname or ''
            port = parts.port
        except ValueError:
            raise ValueError('invalid origin') from None
        if (parts.scheme != 'https' or not host or parts.username or parts.password or
                parts.path or parts.query or parts.fragment or (port is not None and port != 443)):
            raise ValueError('origin must be a clean HTTPS origin')
        if (host in {'localhost', 'localhost.localdomain'} or host.endswith(('.local', '.localhost', '.internal'))
                or '.' not in host or not re.fullmatch(r'[a-z0-9.-]+', host) or '..' in host):
            raise ValueError('origin must use a public DNS hostname')
        try:
            ipaddress.ip_address(host)
        except ValueError:
            pass
        else:
            raise ValueError('IP addresses are not acceptable asset origins')
        labels = host.split('.')
        if (any(not re.fullmatch(r'[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?', x) for x in labels)
                or all(x.isdecimal() for x in labels)):
            raise ValueError('invalid public DNS origin')
        normalized = 'https://' + host
        if origin not in (normalized, normalized + ':443'):
            raise ValueError('origin is not canonical')
        return normalized


    def validate_manifest(doc, *, approved_origins):
        if not isinstance(doc, dict) or set(doc) - FIELDS:
            raise ValueError('manifest is not an object or has unknown keys')
        required = FIELDS - {'permissions'}
        for field in required:
            if not isinstance(doc.get(field), str) or not doc[field].strip():
                raise ValueError('missing or invalid ' + field)
        if not APP_ID.fullmatch(doc['id']) or not PUBLISHER_ID.fullmatch(doc['publisher']):
            raise ValueError('invalid application or publisher ID')
        if not VERSION.fullmatch(doc['version']) or len(doc['version']) > 48:
            raise ValueError('invalid semantic version')
        if not 1 <= len(doc['title']) <= 160 or doc['kind'] not in ALLOWED_KINDS:
            raise ValueError('invalid title or app kind')
        if not re.fullmatch(r'[a-f0-9]{64}', doc['sha256']):
            raise ValueError('sha256 must be a lowercase digest')
        entry = doc['entry']
        try:
            url = urlsplit(entry)
        except ValueError:
            raise ValueError('invalid entrypoint URL') from None
        origin = validate_origin(url.scheme + '://' + (url.netloc or ''))
        if (origin not in approved_origins or url.query or url.fragment or
                not url.path.startswith('/assets/') or doc['sha256'] not in url.path.split('/')):
            raise ValueError('entry must be an approved immutable asset URL')
        if len(entry) > 512:
            raise ValueError('entry is too long')
        permissions = doc.get('permissions', [])
        if (not isinstance(permissions, list) or len(permissions) > 12 or
                any(not isinstance(p, str) or p not in PERMISSIONS for p in permissions) or
                len(set(permissions)) != len(permissions)):
            raise ValueError('invalid permissions')
        return {k: doc[k] for k in ('id', 'title', 'version', 'publisher', 'kind', 'entry', 'sha256')} | {'permissions': permissions}


    def canonical_hash(doc):
        return hashlib.sha256(json.dumps(doc, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()

    """Portable Atrium sidecar validator shared by source CLI and trusted registry handler.

    No deployment URL or service credential may occur in sidecar metadata.
    """
    import re

    COMPONENT_RE = re.compile(r'^[a-z][a-z0-9-]{0,47}$')
    GAME_RE = re.compile(r'^[a-z][a-z0-9.-]{2,119}$')
    NAME_RE = re.compile(r'^[a-z][a-z0-9-]{0,63}$')
    ENTRY_RE = re.compile(r'^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$')
    URL_RE = re.compile(r'(?i)\b(?:https?|wss?|file)://')

    class SidecarError(ValueError):
        pass


    def _mapping(value, keys, required, name):
        if type(value) is not dict or set(value) - keys or not required <= set(value):
            raise SidecarError(name + ': invalid object properties')
        return value


    def _match(value, regex, name):
        if type(value) is not str or not regex.fullmatch(value):
            raise SidecarError(name + ': invalid string')
        return value


    def _no_addresses(value):
        if type(value) is str and (URL_RE.search(value) or value.startswith(('/', '\\'))):
            raise SidecarError('sidecar cannot contain deployment URLs or absolute paths')
        if type(value) is dict:
            for child in value.values(): _no_addresses(child)
        if type(value) is list:
            for child in value: _no_addresses(child)


    def validate_document(doc, *, component):
        _mapping(doc, {'schema', 'component', 'game'}, {'schema', 'component', 'game'}, 'sidecar')
        if doc['schema'] != 'atriumd/v1': raise SidecarError('unsupported sidecar schema')
        if _match(doc['component'], COMPONENT_RE, 'component') != component:
            raise SidecarError('sidecar component differs from activated game component')
        game = _mapping(doc['game'], {'id','publisher','title','summary','kind','platforms','launch','services','integration'},
                        {'id','publisher','title','kind','platforms','launch'}, 'game')
        _match(game['id'], GAME_RE, 'game.id')
        _match(game['publisher'], NAME_RE, 'game.publisher')
        if type(game['title']) is not str or not 1 <= len(game['title'].strip()) <= 160:
            raise SidecarError('invalid game title')
        if 'summary' in game and (type(game['summary']) is not str or not 1 <= len(game['summary'].strip()) <= 300):
            raise SidecarError('invalid game summary')
        if game['kind'] != 'game': raise SidecarError('unsupported application kind')
        platforms = game['platforms']
        if type(platforms) is not list or not 1 <= len(platforms) <= 12: raise SidecarError('invalid platforms')
        runtimes = set()
        for platform in platforms:
            _mapping(platform, {'runtime','formFactors','installMode'}, {'runtime','formFactors','installMode'}, 'platform')
            runtime, install = platform['runtime'], platform['installMode']
            if type(runtime) is not str or runtime not in {'web','windows','linux','macos','android','ios'} or runtime in runtimes:
                raise SidecarError('invalid or duplicate runtime')
            if type(install) is not str or install not in {'none','pwa','offline-web','native'}:
                raise SidecarError('invalid install mode')
            if (runtime != 'web' and install in {'pwa','offline-web'}) or (runtime == 'web' and install == 'native'):
                raise SidecarError('install mode incompatible with runtime')
            forms = platform['formFactors']
            if type(forms) is not list or not forms or any(type(x) is not str or x not in {'desktop','tablet','phone'} for x in forms) or len(forms) != len(set(forms)):
                raise SidecarError('invalid form factors')
            runtimes.add(runtime)
        launch = _mapping(game['launch'], {'mode','originRef','entrypoint'}, {'mode','originRef','entrypoint'}, 'launch')
        if launch['mode'] != 'hosted-web' or 'web' not in runtimes:
            raise SidecarError('unsupported launch mode')
        _match(launch['originRef'], NAME_RE, 'originRef')
        entry = _match(launch['entrypoint'], ENTRY_RE, 'entrypoint')
        if any(x in {'.','..',''} for x in entry.split('/')): raise SidecarError('unsafe entrypoint')
        services = game.get('services', [])
        if type(services) is not list or len(services) > 12: raise SidecarError('invalid services')
        seen = set()
        for service in services:
            _mapping(service, {'component','role'}, {'component','role'}, 'service')
            _match(service['component'], COMPONENT_RE, 'service.component')
            if service['role'] not in {'multiplayer','activity','achievements','content'}:
                raise SidecarError('invalid service role')
            key = service['component'], service['role']
            if key in seen: raise SidecarError('duplicate service')
            seen.add(key)
        if 'integration' in game:
            integration = _mapping(game['integration'], {'atriumOptional','sessions','state','identity'},
                                   {'atriumOptional','sessions','state','identity'}, 'integration')
            if type(integration['atriumOptional']) is not bool or not integration['atriumOptional'] or any(integration[key] != 'game-owned' for key in ('sessions','state','identity')):
                raise SidecarError('game remains authority for state, identity and sessions')
        _no_addresses(doc)
        return doc

    """Operator-only durable registry handlers; generated inline into DAPI spec.

    Clients never write App/Publisher/Release tables directly. All updates are reviewed.
    """
    import json
    import uuid
    from datetime import datetime, timezone

    from sqlalchemy import text
    from starlette.exceptions import HTTPException


    def _fail(message, status=422):
        raise HTTPException(status_code=status, detail=message)


    def _body(ctx):
        if not isinstance(ctx.body, dict):
            _fail('expected a JSON object')
        return ctx.body


    def _when():
        return datetime.now(timezone.utc).isoformat(timespec='seconds')


    def _row(session, statement, **values):
        return session.execute(text(statement), values).mappings().first()


    def _rows(session, statement, **values):
        return [dict(x) for x in session.execute(text(statement), values).mappings()]


    def _json(value):
        return value if isinstance(value, (dict, list)) else json.loads(value)


    def _as_json(value):
        return json.dumps(value, sort_keys=True, separators=(',', ':'))


    def _tx(ctx):
        return ctx.transaction() if ctx.transaction else ctx.session_factory.begin()


    def _emit(ctx, session, action, row_id, data):
        event = {'resource': 'apps', 'action': action, 'id': row_id, 'data': data}
        if ctx.emit:
            ctx.emit(session, event)
        else:
            # Kept only for legacy DAPI with best-effort event delivery.
            pass


    def _publisher(session, publisher_id):
        return _row(session, 'SELECT * FROM "Publisher" WHERE "publisherId"=:pid', pid=publisher_id)


    def _submission(session, sid):
        return _row(session, 'SELECT * FROM "AppSubmission" WHERE "submissionId"=:sid', sid=sid)


    async def register_publisher(ctx):
        body = _body(ctx)
        publisher_id, name, origins = body.get('id'), body.get('name'), body.get('origins')
        if not isinstance(publisher_id, str) or not PUBLISHER_ID.fullmatch(publisher_id):
            _fail('invalid publisher ID')
        if not isinstance(name, str) or not 1 <= len(name) <= 160:
            _fail('invalid publisher name')
        if not isinstance(origins, list) or not 1 <= len(origins) <= 8:
            _fail('publisher requires 1-8 reviewed origins')
        try:
            origins = [validate_origin(x) for x in origins]
        except ValueError as error:
            _fail(str(error))
        if len(origins) != len(set(origins)):
            _fail('duplicate publisher origin')
        with _tx(ctx) as session:
            if _publisher(session, publisher_id):
                _fail('publisher already exists', 409)
            session.execute(text('INSERT INTO "Publisher" ("publisherId","displayName","origins","status","createdAt") '
                                 'VALUES (:pid,:name,:origins,:status,:created)'),
                            {'pid': publisher_id, 'name': name, 'origins': _as_json(origins),
                             'status': 'active', 'created': _when()})
        return {'publisherId': publisher_id, 'status': 'active', 'ownership': 'operator_attested'}


    async def submit(ctx):
        body = _body(ctx)
        manifest = body.get('manifest')
        if not isinstance(manifest, dict):
            _fail('manifest must be an object')
        if len(_as_json(manifest)) > 16384:
            _fail('manifest too large', 413)
        with _tx(ctx) as session:
            publisher_id = manifest.get('publisher')
            publisher = _publisher(session, publisher_id) if isinstance(publisher_id, str) else None
            if not publisher or publisher['status'] != 'active':
                _fail('publisher not approved', 403)
            try:
                checked = validate_manifest(manifest, approved_origins=set(_json(publisher['origins'])))
            except ValueError as error:
                _fail(str(error))
            existing = _row(session, 'SELECT "publisher" FROM "App" WHERE "appId"=:app', app=checked['id'])
            if existing and existing['publisher'] != publisher_id:
                _fail('app already belongs to another publisher', 409)
            prior = _row(session, 'SELECT "id" FROM "AppSubmission" WHERE "appId"=:app AND '
                         '"version"=:version AND "status" IN (\'pending\',\'approved\')',
                         app=checked['id'], version=checked['version'])
            if prior or _row(session, 'SELECT "id" FROM "AppRelease" WHERE "appId"=:app AND "version"=:version',
                              app=checked['id'], version=checked['version']):
                _fail('version already submitted or published', 409)
            sid = uuid.uuid4().hex
            session.execute(text('INSERT INTO "AppSubmission" '
                                 '("submissionId","appId","publisherId","version","manifest","digest","status","submittedAt") '
                                 'VALUES (:sid,:app,:pid,:version,:manifest,:digest,\'pending\',:created)'),
                            {'sid': sid, 'app': checked['id'], 'pid': publisher_id, 'version': checked['version'],
                             'manifest': _as_json(checked), 'digest': canonical_hash(checked), 'created': _when()})
        return {'submissionId': sid, 'status': 'pending', 'digest': canonical_hash(checked)}


    def _version_key(value):
        match = VERSION.fullmatch(value)
        return tuple(int(match.group(i)) for i in (1, 2, 3)) if match else (0, 0, 0)


    def _update_app(session, manifest, digest):
        app_id = manifest['id']
        old = _row(session, 'SELECT "id","publisher","version","status" FROM "App" WHERE "appId"=:app', app=app_id)
        if old and old['publisher'] != manifest['publisher']:
            _fail('publisher ownership conflict', 409)
        if old:
            if _version_key(manifest['version']) <= _version_key(old['version']):
                _fail('approved version must be newer than current version', 409)
            session.execute(text('UPDATE "App" SET "title"=:title,"category"=:kind,"version"=:version,'
                                 '"status"=\'published\',"manifest"=:manifest WHERE "appId"=:app'),
                            {'title': manifest['title'], 'kind': manifest['kind'], 'version': manifest['version'],
                             'manifest': _as_json(manifest), 'app': app_id})
            return old['id'], 'updated'
        session.execute(text('INSERT INTO "App" '
                             '("appId","title","publisher","category","version","status","manifest") '
                             'VALUES (:app,:title,:publisher,:kind,:version,\'published\',:manifest)'),
                        {'app': app_id, 'title': manifest['title'], 'publisher': manifest['publisher'],
                         'kind': manifest['kind'], 'version': manifest['version'], 'manifest': _as_json(manifest)})
        inserted = _row(session, 'SELECT "id" FROM "App" WHERE "appId"=:app', app=app_id)
        return inserted['id'], 'created'


    async def review(ctx):
        body = _body(ctx)
        sid, decision = body.get('submissionId'), body.get('decision')
        if not isinstance(sid, str) or len(sid) != 32 or decision not in ('approve', 'reject'):
            _fail('invalid review decision')
        with _tx(ctx) as session:
            entry = _submission(session, sid)
            if not entry:
                _fail('unknown submission', 404)
            if entry['status'] != 'pending':
                _fail('submission already reviewed', 409)
            manifest = _json(entry['manifest'])
            if decision == 'approve':
                publisher = _publisher(session, entry['publisherId'])
                if not publisher or publisher['status'] != 'active':
                    _fail('publisher not active', 403)
                try:
                    checked = validate_manifest(manifest, approved_origins=set(_json(publisher['origins'])))
                except ValueError as error:
                    _fail(str(error))
                if canonical_hash(checked) != entry['digest']:
                    _fail('submitted manifest changed', 409)
                existing = _row(session, 'SELECT "id" FROM "AppRelease" WHERE "appId"=:app AND "version"=:version',
                                app=checked['id'], version=checked['version'])
                if existing:
                    _fail('immutable version already published', 409)
                session.execute(text('INSERT INTO "AppRelease" '
                                     '("appId","version","publisherId","manifest","digest","approvedAt") '
                                     'VALUES (:app,:version,:pid,:manifest,:digest,:now)'),
                                {'app': checked['id'], 'version': checked['version'], 'pid': checked['publisher'],
                                 'manifest': _as_json(checked), 'digest': entry['digest'], 'now': _when()})
                record_id, action = _update_app(session, checked, entry['digest'])
                _emit(ctx, session, action, record_id, {'id': record_id, 'appId': checked['id'],
                      'version': checked['version'], 'status': 'published'})
            session.execute(text('UPDATE "AppSubmission" SET "status"=:status,"reviewedAt"=:now WHERE "submissionId"=:sid'),
                            {'status': 'approved' if decision == 'approve' else 'rejected', 'now': _when(), 'sid': sid})
        return {'submissionId': sid, 'status': 'approved' if decision == 'approve' else 'rejected'}


    async def disable(ctx):
        body = _body(ctx)
        app_id = body.get('appId')
        if not isinstance(app_id, str) or not APP_ID.fullmatch(app_id):
            _fail('invalid app ID')
        with _tx(ctx) as session:
            row = _row(session, 'SELECT "id","status" FROM "App" WHERE "appId"=:app', app=app_id)
            if not row:
                _fail('unknown application', 404)
            if row['status'] != 'published':
                _fail('only published apps can be disabled', 409)
            session.execute(text('UPDATE "App" SET "status"=\'disabled\' WHERE "appId"=:app'), {'app': app_id})
            _emit(ctx, session, 'updated', row['id'], {'id': row['id'], 'appId': app_id, 'status': 'disabled'})
        return {'appId': app_id, 'status': 'disabled'}


    def _approved_catalog(session, *, after='', limit=10000):
        """Project only active, immutable, reviewed releases; reject any tampering."""
        rows = _rows(session, 'SELECT a."appId", a."publisher", a."version", a."manifest", '
                     'r."digest", r."manifest" AS "reviewed", r."publisherId" AS "releasePublisher", '
                     'p."origins" FROM "App" AS a JOIN "AppRelease" AS r '
                     'ON a."appId"=r."appId" AND a."version"=r."version" '
                     'JOIN "Publisher" AS p ON a."publisher"=p."publisherId" '
                     'WHERE a."status"=\'published\' AND p."status"=\'active\' '
                     'AND a."appId">:after ORDER BY a."appId" LIMIT :limit',
                     after=after, limit=min(limit, 10001))
        apps = []
        for row in rows:
            try:
                manifest = _json(row['reviewed'])
                actual = _json(row['manifest'])
                checked = validate_manifest(manifest, approved_origins=set(_json(row['origins'])))
                if (checked != manifest or manifest != actual or
                        manifest['id'] != row['appId'] or manifest['version'] != row['version'] or
                        manifest['publisher'] != row['publisher'] or row['releasePublisher'] != row['publisher'] or
                        canonical_hash(manifest) != row['digest']):
                    continue
                apps.append(manifest)
            except (ValueError, KeyError, TypeError, json.JSONDecodeError):
                continue
        return apps


    async def catalog(ctx):
        query = getattr(getattr(ctx, 'request', None), 'query_params', {})
        after = query.get('after', '')
        raw_limit = query.get('limit', '100')
        if not isinstance(after, str) or len(after) > 120 or (after and not APP_ID.fullmatch(after)):
            _fail('invalid catalog cursor')
        if not isinstance(raw_limit, str) or not raw_limit.isascii() or not raw_limit.isdecimal():
            _fail('invalid catalog page size')
        limit = int(raw_limit)
        if not 1 <= limit <= 100:
            _fail('catalog limit must be 1-100')
        with ctx.session_factory() as session:
            approved = _approved_catalog(session, after=after, limit=10001)
        page = approved[:limit]
        return {'schema': 'atrium.catalog/v1', 'apps': page,
                'count': len(page), 'next': page[-1]['id'] if len(approved) > limit else None,
                'hasMore': len(approved) > limit, 'authenticated': True}


    async def change_publisher_status(ctx):
        body = _body(ctx)
        publisher_id, status = body.get('publisherId'), body.get('status')
        if not isinstance(publisher_id, str) or not PUBLISHER_ID.fullmatch(publisher_id):
            _fail('invalid publisher')
        if status not in ('active', 'disabled'):
            _fail('invalid publisher status')
        with _tx(ctx) as session:
            row = _publisher(session, publisher_id)
            if not row:
                _fail('publisher not found', 404)
            if row['status'] == status:
                _fail('publisher status already set', 409)
            session.execute(text('UPDATE "Publisher" SET "status"=:status WHERE "publisherId"=:pid'),
                            {'status': status, 'pid': publisher_id})
            affected = _rows(session, 'SELECT "id","appId","version" FROM "App" '
                             'WHERE "publisher"=:pid AND "status"=\'published\' ORDER BY "appId"', pid=publisher_id)
            for app in affected:
                _emit(ctx, session, 'updated', app['id'], {'id': app['id'], 'appId': app['appId'],
                      'version': app['version'], 'status': 'publisher_' + status})
        return {'publisherId': publisher_id, 'status': status, 'affectedApps': len(affected)}


    async def submissions(ctx):
        with ctx.session_factory() as session:
            rows = _rows(session, 'SELECT "submissionId","appId","publisherId","version","digest",'
                         '"status","submittedAt","reviewedAt" FROM "AppSubmission" '
                         'ORDER BY "id" DESC LIMIT 100')
        return {'submissions': rows}

    """Operator-attested discovery candidate intake. Does NOT publish a game.

    Generated into Looprd handlers. Endpoint is scoped to apps:approve only; never
    accepts a client-supplied credential or claims independent proof of deployment.
    """
    import hashlib
    import json
    import re

    from sqlalchemy import text
    from starlette.exceptions import HTTPException

    DEPLOYMENT_ID = re.compile(r'^[a-z][a-z0-9-]{2,95}$')
    REVISION_ID = re.compile(r'^[a-f0-9]{40}$')


    def _discovery_fail(message, status=422):
        raise HTTPException(status_code=status, detail=message)


    def _discovery_canonical(value):
        return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':'))


    async def record_discovery(ctx):
        payload = ctx.body
        if type(payload) is not dict or set(payload) != {'deploymentId','component','sourceRevision','sidecar'}:
            _discovery_fail('exact discovery envelope required')
        deployment, component, revision = (payload['deploymentId'],payload['component'],payload['sourceRevision'])
        if type(deployment) is not str or not DEPLOYMENT_ID.fullmatch(deployment):
            _discovery_fail('invalid operator-configured deployment ID')
        if type(component) is not str or not COMPONENT_RE.fullmatch(component):
            _discovery_fail('invalid activated component ID')
        if type(revision) is not str or not REVISION_ID.fullmatch(revision):
            _discovery_fail('source revision must be immutable Git commit SHA')
        sidecar = payload['sidecar']
        if len(_discovery_canonical(sidecar)) > 65_536:
            _discovery_fail('sidecar too large', 413)
        try:
            validate_document(sidecar, component=component)
        except SidecarError as error:
            _discovery_fail(str(error))
        game = sidecar['game']
        digest = hashlib.sha256(_discovery_canonical(sidecar).encode('utf-8')).hexdigest()
        with (ctx.transaction() if ctx.transaction else ctx.session_factory.begin()) as session:
            conflict = session.execute(text('SELECT "publisherId" FROM "AtriumDiscoveryCandidate" WHERE "gameId"=:gid AND "publisherId"<>:pid LIMIT 1'),
                                       {'gid':game['id'], 'pid':game['publisher']}).mappings().first()
            if conflict:
                _discovery_fail('game identity already claimed by a different publisher', 409)
            published = session.execute(text('SELECT "publisher" FROM "App" WHERE "appId"=:gid'), {'gid':game['id']}).mappings().first()
            if published and published['publisher'] != game['publisher']:
                _discovery_fail('published game belongs to another publisher',409)
            row = session.execute(text('SELECT "id","fingerprint","status","sourceRevision" FROM "AtriumDiscoveryCandidate" '
                                       'WHERE "deploymentId"=:deployment AND "component"=:component'),
                                  {'deployment':deployment,'component':component}).mappings().first()
            if row and row['fingerprint'] == digest and row['sourceRevision'] == revision and row['status'] == 'pending':
                return {'status':'pending','change':'unchanged','gameId':game['id'],'fingerprint':digest}
            if row and row['fingerprint'] == digest and row['sourceRevision'] == revision and row['status'] == 'reviewed':
                return {'status':'reviewed','change':'unchanged','gameId':game['id'],'fingerprint':digest}
            if row:
                session.execute(text('UPDATE "AtriumDiscoveryCandidate" SET "gameId"=:gid,"publisherId"=:pid,'
                                     '"sourceRevision"=:revision,"fingerprint"=:digest,"sidecar"=:sidecar,'
                                     '"status"=\'pending\',"updatedAt"=:updated WHERE "id"=:id'),
                                {'gid':game['id'],'pid':game['publisher'],'revision':revision,'digest':digest,
                                 'sidecar':_discovery_canonical(sidecar),'updated':_when(),'id':row['id']})
                change='updated'
            else:
                session.execute(text('INSERT INTO "AtriumDiscoveryCandidate" '
                                     '("deploymentId","component","gameId","publisherId","sourceRevision",'
                                     '"fingerprint","sidecar","status","updatedAt") '
                                     'VALUES (:deployment,:component,:gid,:pid,:revision,:digest,:sidecar,\'pending\',:updated)'),
                                {'deployment':deployment,'component':component,'gid':game['id'],'pid':game['publisher'],
                                 'revision':revision,'digest':digest,'sidecar':_discovery_canonical(sidecar),'updated':_when()})
                change='created'
        return {'status':'pending','change':change,'gameId':game['id'],'fingerprint':digest}


    async def list_discoveries(ctx):
        with ctx.session_factory() as session:
            rows = session.execute(text('SELECT "deploymentId","component","gameId","publisherId",'
                                        '"sourceRevision","fingerprint","status","updatedAt" '
                                        'FROM "AtriumDiscoveryCandidate" ORDER BY "id" DESC LIMIT 100')).mappings().all()
        return {'schema':'atrium.discovery-queue/v1','candidates':[dict(r) for r in rows]}

    """Operator-scoped HTTPS origin ownership challenges.

    Domain control is not developer identity. This module never publishes a game,
    changes a publisher's operator approval, or returns secret credentials to users.
    The network verifier deliberately avoids URL clients/proxies and pins the
    validated public DNS resolution to its TLS connection to prevent DNS rebinding.
    """
    import hashlib
    import hmac
    import http.client
    import ipaddress
    import secrets
    import socket
    import ssl
    import uuid
    from datetime import datetime, timedelta, timezone
    from urllib.parse import urlsplit

    from sqlalchemy import text
    from starlette.exceptions import HTTPException

    PROOF_LIFETIME = timedelta(minutes=15)
    PROOF_PREFIX = '/.well-known/atrium-publisher-proof/'
    PROOF_MAX_BYTES = 1024


    def _proof_fail(message, status=422):
        raise HTTPException(status_code=status, detail=message)


    def _proof_now():
        return datetime.now(timezone.utc)


    def _proof_stamp(value):
        return value.isoformat(timespec='seconds')


    def _proof_fields(body, *, verifying=False):
        allowed = {'publisherId', 'origin', 'challengeId'} if verifying else {'publisherId', 'origin'}
        if type(body) is not dict or set(body) != allowed:
            _proof_fail('exact publisher proof envelope required')
        publisher_id, origin = body['publisherId'], body['origin']
        if type(publisher_id) is not str or not PUBLISHER_ID.fullmatch(publisher_id):
            _proof_fail('invalid publisher ID')
        try:
            checked = validate_origin(origin)
        except ValueError as error:
            _proof_fail(str(error))
        if verifying:
            challenge_id = body['challengeId']
            if (type(challenge_id) is not str or len(challenge_id) != 32 or
                    any(c not in '0123456789abcdef' for c in challenge_id)):
                _proof_fail('invalid challenge ID')
            return publisher_id, checked, challenge_id
        return publisher_id, checked


    def _proof_publisher(session, publisher_id, origin):
        publisher = _publisher(session, publisher_id)
        if not publisher or publisher['status'] != 'active':
            _proof_fail('publisher is not active', 403)
        if origin not in _json(publisher['origins']):
            _proof_fail('origin is not approved for this publisher', 403)
        return publisher


    def _public_addresses(host):
        """Reject *all* private/special answers; caller connects to returned IP, not DNS again."""
        try:
            answers = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
            addresses = []
            for row in answers:
                ip = ipaddress.ip_address(row[4][0])
                if (not ip.is_global or ip.is_multicast or ip.is_unspecified or
                        (isinstance(ip, ipaddress.IPv6Address) and ip.ipv4_mapped)):
                    raise ValueError('origin resolves outside public internet')
                addresses.append(str(ip))
            if not addresses:
                raise ValueError('origin has no public address')
            return tuple(dict.fromkeys(addresses))
        except (OSError, ValueError) as error:
            raise ValueError('safe public DNS resolution failed') from error


    def _read_public_https(origin, challenge_id):
        """Only port 443, verified TLS, pinned public IP, bounded GET, no redirects/proxies."""
        host = urlsplit(validate_origin(origin)).hostname
        path = PROOF_PREFIX + challenge_id + '.txt'
        addresses = _public_addresses(host)
        sock = None
        secure = None
        response = None
        try:
            sock = socket.create_connection((addresses[0], 443), timeout=3)
            secure = ssl.create_default_context().wrap_socket(sock, server_hostname=host)
            secure.settimeout(3)
            request = ('GET ' + path + ' HTTP/1.1\r\nHost: ' + host +
                       '\r\nAccept: text/plain\r\nAccept-Encoding: identity\r\nConnection: close\r\n\r\n')
            secure.sendall(request.encode('ascii'))
            response = http.client.HTTPResponse(secure)
            response.begin()
            if response.status != 200:
                raise ValueError('proof endpoint did not return HTTP 200 (redirects disallowed)')
            if response.getheader('Content-Encoding', 'identity').lower() != 'identity':
                raise ValueError('compressed proof is forbidden')
            raw = response.read(PROOF_MAX_BYTES + 1)
            if len(raw) > PROOF_MAX_BYTES:
                raise ValueError('proof response too large')
            return raw
        except (OSError, ssl.SSLError, http.client.HTTPException) as error:
            raise ValueError('verified HTTPS proof fetch failed') from error
        finally:
            if response:
                response.close()
            if secure:
                secure.close()
            elif sock:
                sock.close()


    async def issue_publisher_proof(ctx):
        publisher_id, origin = _proof_fields(ctx.body)
        now = _proof_now()
        challenge_id = uuid.uuid4().hex
        nonce = secrets.token_urlsafe(32)
        proof = ('atrium-publisher-proof/v1\npublisher=' + publisher_id + '\norigin=' + origin +
                 '\nchallenge=' + challenge_id + '\nnonce=' + nonce + '\n')
        digest = hashlib.sha256(proof.encode('utf-8')).hexdigest()
        expires = _proof_stamp(now + PROOF_LIFETIME)
        with _tx(ctx) as session:
            _proof_publisher(session, publisher_id, origin)
            another = _row(session, 'SELECT "publisherId" FROM "PublisherOriginProof" '
                           'WHERE "origin"=:origin AND "publisherId"<>:pid',
                           pid=publisher_id, origin=origin)
            if another:
                _proof_fail('origin already claimed by another publisher', 409)
            prior = _row(session, 'SELECT "id" FROM "PublisherOriginProof" WHERE "publisherId"=:pid AND "origin"=:origin',
                         pid=publisher_id, origin=origin)
            args = {'pid': publisher_id, 'origin': origin, 'challenge': challenge_id, 'digest': digest,
                    'now': _proof_stamp(now), 'expires': expires}
            if prior:
                session.execute(text('UPDATE "PublisherOriginProof" SET "challengeId"=:challenge,"tokenDigest"=:digest,'
                                     '"status"=\'pending\',"issuedAt"=:now,"expiresAt"=:expires,"verifiedAt"=NULL '
                                     'WHERE "publisherId"=:pid AND "origin"=:origin'), args)
            else:
                session.execute(text('INSERT INTO "PublisherOriginProof" '
                                     '("publisherId","origin","challengeId","tokenDigest","status","issuedAt","expiresAt") '
                                     'VALUES (:pid,:origin,:challenge,:digest,\'pending\',:now,:expires)'), args)
        return {'schema': 'atrium.publisher-proof/v1', 'status': 'pending', 'publisherId': publisher_id,
                'origin': origin, 'challengeId': challenge_id, 'expiresAt': expires,
                'proofUrl': origin + PROOF_PREFIX + challenge_id + '.txt', 'proofContent': proof,
                'operatorApprovalRequired': True}


    async def verify_publisher_proof(ctx):
        publisher_id, origin, challenge_id = _proof_fields(ctx.body, verifying=True)
        with ctx.session_factory() as session:
            _proof_publisher(session, publisher_id, origin)
            entry = _row(session, 'SELECT * FROM "PublisherOriginProof" '
                         'WHERE "publisherId"=:pid AND "origin"=:origin', pid=publisher_id, origin=origin)
            if not entry or entry['challengeId'] != challenge_id or entry['status'] != 'pending':
                _proof_fail('unknown, replaced or used challenge', 409)
            if _proof_stamp(_proof_now()) >= entry['expiresAt']:
                _proof_fail('challenge expired', 409)
            digest = entry['tokenDigest']
        try:
            supplied = _read_public_https(origin, challenge_id)
        except ValueError as error:
            _proof_fail(str(error), 502)
        if not hmac.compare_digest(hashlib.sha256(supplied).hexdigest(), digest):
            _proof_fail('HTTPS proof content does not match challenge')
        with _tx(ctx) as session:
            _proof_publisher(session, publisher_id, origin)
            result = session.execute(text('UPDATE "PublisherOriginProof" SET "status"=\'verified\',"verifiedAt"=:now '
                                          'WHERE "publisherId"=:pid AND "origin"=:origin AND "challengeId"=:challenge '
                                          'AND "tokenDigest"=:digest AND "status"=\'pending\' AND "expiresAt">:now'),
                                     {'now': _proof_stamp(_proof_now()), 'pid': publisher_id, 'origin': origin,
                                      'challenge': challenge_id, 'digest': digest})
            if result.rowcount != 1:
                _proof_fail('challenge was replaced, expired or consumed', 409)
        return {'schema': 'atrium.publisher-proof/v1', 'publisherId': publisher_id, 'origin': origin,
                'challengeId': challenge_id, 'status': 'verified', 'operatorApprovalRequired': True,
                'publisherIdentityVerified': False}


    async def list_publisher_proofs(ctx):
        query = getattr(getattr(ctx, 'request', None), 'query_params', {})
        publisher_id = query.get('publisherId')
        if type(publisher_id) is not str or not PUBLISHER_ID.fullmatch(publisher_id):
            _proof_fail('valid publisherId query required')
        with ctx.session_factory() as session:
            entries = _rows(session, 'SELECT "publisherId","origin","challengeId","status","issuedAt",'
                            '"expiresAt","verifiedAt" FROM "PublisherOriginProof" WHERE "publisherId"=:pid '
                            'ORDER BY "origin" LIMIT 8', pid=publisher_id)
        return {'schema': 'atrium.publisher-proofs/v1', 'proofs': entries, 'operatorApprovalRequired': True}


    async def handle(ctx):
        return await review(ctx)
