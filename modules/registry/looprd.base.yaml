resources:
  apps:
    model: App
    path: /apps
    operations:
    - list
    - get
    permissions:
      list:
      - apps:approve
      get:
      - apps:approve
  endpoints:
    model: RegisteredEndpoint
    path: /endpoints
    operations:
    - list
    - get
    permissions:
      list:
      - apps:approve
      get:
      - apps:approve
websocket:
  resources:
  - apps
  - endpoints
  permissions:
    apps:
    - apps:events
    endpoints:
    - apps:events
handlers:
- path: /registry/info
  kind: response
  scopes:
  - apps:read
  response:
    service: registry
    contract: atrium.registry/v1
    status: reviewed-with-public-snapshot-export
    publicCatalog: false
    publisherOwnership: operator_attested
    assetContentVerified: false
    socialLoginIntegrated: false
