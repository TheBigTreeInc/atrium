apiVersion: looprd/v1
component: atrium
release: 0.5.25
api:
  version: v1
auth:
  mode: database
  scopes:
  - apps:read
  - apps:publish
  - apps:events
  - arcade:read
  - arcade:operator
  - arcade:events
  - checkers:read
  - checkers:play
  - apps:approve
  - apps:discover
database:
  backend: sqlite
  schemaVersion: 6
  migrations:
  - version: 2
    statements:
    - CREATE TABLE "Publisher" ("id" INTEGER PRIMARY KEY, "publisherId" VARCHAR(120)
      NOT NULL UNIQUE, "displayName" VARCHAR(160) NOT NULL, "origins" JSON NOT NULL,
      "status" VARCHAR(32) NOT NULL, "createdAt" VARCHAR(40) NOT NULL)
    - CREATE TABLE "AppSubmission" ("id" INTEGER PRIMARY KEY, "submissionId" VARCHAR(64)
      NOT NULL UNIQUE, "appId" VARCHAR(120) NOT NULL, "publisherId" VARCHAR(120) NOT
      NULL, "version" VARCHAR(48) NOT NULL, "manifest" JSON NOT NULL, "digest" VARCHAR(64)
      NOT NULL, "status" VARCHAR(32) NOT NULL, "submittedAt" VARCHAR(40) NOT NULL,
      "reviewedAt" VARCHAR(40))
    - CREATE TABLE "AppRelease" ("id" INTEGER PRIMARY KEY, "appId" VARCHAR(120) NOT
      NULL, "version" VARCHAR(48) NOT NULL, "publisherId" VARCHAR(120) NOT NULL, "manifest"
      JSON NOT NULL, "digest" VARCHAR(64) NOT NULL, "approvedAt" VARCHAR(40) NOT NULL,
      UNIQUE ("appId", "version"))
  - version: 3
    statements:
    - CREATE TABLE "AtriumDiscoveryCandidate" ("id" INTEGER PRIMARY KEY, "deploymentId"
      VARCHAR(96) NOT NULL, "component" VARCHAR(48) NOT NULL, "gameId" VARCHAR(120)
      NOT NULL, "publisherId" VARCHAR(120) NOT NULL, "sourceRevision" VARCHAR(40)
      NOT NULL, "fingerprint" VARCHAR(64) NOT NULL, "sidecar" JSON NOT NULL, "status"
      VARCHAR(32) NOT NULL, "updatedAt" VARCHAR(40) NOT NULL, UNIQUE("deploymentId",
      "component"))
  - version: 4
    statements:
    - CREATE TABLE "PublisherOriginProof" ("id" INTEGER PRIMARY KEY, "publisherId"
      VARCHAR(120) NOT NULL, "origin" VARCHAR(255) NOT NULL, "challengeId" VARCHAR(32)
      NOT NULL, "tokenDigest" VARCHAR(64) NOT NULL, "status" VARCHAR(16) NOT NULL,
      "issuedAt" VARCHAR(40) NOT NULL, "expiresAt" VARCHAR(40) NOT NULL, "verifiedAt"
      VARCHAR(40), UNIQUE("publisherId", "origin"), UNIQUE("origin"))
  - version: 5
    statements:
    - ALTER TABLE "AtriumDiscoveryCandidate" ADD COLUMN "availability" VARCHAR(24)
    - ALTER TABLE "AtriumDiscoveryCandidate" ADD COLUMN "sourceProvenance" JSON
    - CREATE TABLE "AtriumDiscoveryBinding" ("id" INTEGER PRIMARY KEY, "deploymentId"
      VARCHAR(96) NOT NULL, "component" VARCHAR(48) NOT NULL, "gameId" VARCHAR(120)
      NOT NULL, "publisherId" VARCHAR(120) NOT NULL, "callerSubject" VARCHAR(48) NOT
      NULL UNIQUE, "sourceIdentity" VARCHAR(64) NOT NULL, "deliveryEpoch" VARCHAR(32)
      NOT NULL, "launchOrigins" JSON NOT NULL, "status" VARCHAR(16) NOT NULL, "lastSequence"
      INTEGER NOT NULL, "lastDigest" VARCHAR(64), "createdAt" VARCHAR(40) NOT NULL,
      UNIQUE ("deploymentId", "component"))
  - version: 6
    statements:
    - CREATE TABLE "AtriumTrustedDeployment" ("id" INTEGER PRIMARY KEY, "deploymentId"
      VARCHAR(96) NOT NULL UNIQUE, "callerSubject" VARCHAR(48) NOT NULL UNIQUE, "publisherId"
      VARCHAR(64) NOT NULL, "apiOrigin" VARCHAR(255) NOT NULL, "launchOrigins" JSON
      NOT NULL, "status" VARCHAR(16) NOT NULL, "createdAt" VARCHAR(40) NOT NULL)
    - CREATE TABLE "AtriumTrustedInstance" ("id" INTEGER PRIMARY KEY, "deploymentId"
      VARCHAR(96) NOT NULL, "component" VARCHAR(48) NOT NULL, "gameId" VARCHAR(120),
      "publisherId" VARCHAR(64) NOT NULL, "state" VARCHAR(16) NOT NULL, "sidecar"
      JSON, "sourceProvenance" JSON, "fingerprint" VARCHAR(64) NOT NULL, "apiBaseUrl"
      VARCHAR(512), "lastSequence" BIGINT NOT NULL, "updatedAt" VARCHAR(40) NOT NULL,
      UNIQUE("deploymentId", "component"))
    - CREATE TABLE "AtriumTrustedReceipt" ("id" INTEGER PRIMARY KEY, "deploymentId"
      VARCHAR(96) NOT NULL, "component" VARCHAR(48) NOT NULL, "operationId" VARCHAR(32)
      NOT NULL, "sequence" BIGINT NOT NULL, "fingerprint" VARCHAR(64) NOT NULL, "ack"
      JSON NOT NULL, UNIQUE("deploymentId", "component", "operationId"), UNIQUE("deploymentId",
      "component", "sequence"))
requires:
- spec.includes
- events.transactional
- events.replay
includes:
- modules/registry/looprd.yaml
- modules/arcade/looprd.yaml
- modules/games/checkers/looprd.yaml
websocket:
  path: /events
limits:
  requestsPerMinute: 120
  burstPerSecond: 10
  maxRows: 10000
handlers:
- path: /info
  method: GET
  kind: response
  response:
    service: atrium
    contract: atrium.platform/v1
    phase: registry-snapshot-export
    deploymentVerification: operator_required
    modules:
    - registry
    - arcade
    - checkers
    staffDisplayLabel: Staff
    socialLoginIntegrated: false
    registry: atrium.registry/v1
    catalogPublic: false
  scopes:
  - apps:read
realtime:
  delivery: durable
  retentionSeconds: 86400
  maxEvents: 10000
