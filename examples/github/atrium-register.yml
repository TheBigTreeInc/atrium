# Copy into the GAME repository: .github/workflows/atrium-register.yml
# Checks compatibility and notifies a public LoopRD inbox; never needs Atrium credentials.
name: Verify Atrium game compatibility
on:
  workflow_run:
    workflows: ['Deploy The Life Loop to GitHub Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  compatibility:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Pin a reviewed Atrium commit rather than @main in production.
      - uses: TheBigTreeInc/atrium/.github/actions/register-game@main
        with:
          source-sha: ${{ github.event.workflow_run.head_sha }}
          pages-run-id: ${{ github.event.workflow_run.id }}
# No cross-repository token or permission. The public notice is not a publication grant.
